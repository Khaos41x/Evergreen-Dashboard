<!doctype html>
<html lang="pt-BR"><body style="margin:0;padding:32px 16px;background:#08100c;color:#e8f2eb;font-family:Arial,sans-serif">
<main style="max-width:520px;margin:auto;padding:28px;background:#0d1912">
<h1>Confirme seu e-mail na Evergreen</h1>
<p>Digite este código na tela de cadastro:</p>
<p style="font-size:32px;letter-spacing:.2em;color:#43dfa5">{{ .Token }}</p>
<p>Ou abra o link e confirme para continuar:</p>
<p><a style="color:#43dfa5" href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=signup">Confirmar meu e-mail</a></p>
<p>Uma conta não concede acesso automático às empresas. Se você não solicitou este cadastro, ignore a mensagem.</p>
</main></body></html>
