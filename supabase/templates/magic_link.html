<html lang="pt-BR">
  <body style="margin:0;padding:32px 16px;background:#08100c;color:#e8f2eb;font-family:Arial,sans-serif">
    <main style="max-width:520px;margin:0 auto;padding:28px;border:1px solid #294437;border-radius:12px;background:#0d1912">
      <p style="margin:0 0 12px;color:#9fe6c3;font-size:12px;letter-spacing:.12em;text-transform:uppercase">Evergreen Holdings</p>
      <h1 style="margin:0 0 14px;font-size:23px;font-weight:600">Seu código de acesso</h1>
      <p style="line-height:1.6;color:#c6d6cb">Use este código no Evergreen para entrar ou confirmar sua identidade:</p>
      <p style="margin:24px 0;padding:16px;border:1px solid #326047;border-radius:8px;background:#102419;text-align:center;font-size:32px;font-weight:700;letter-spacing:.24em;color:#43dfa5">{{ .Token }}</p>
      <p><a style="color:#43dfa5" href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=email">Confirmar acesso pelo navegador</a></p>
      <p style="line-height:1.6;color:#a9bdb0">Se você não solicitou este código, ignore esta mensagem. A equipe Evergreen nunca pedirá que você envie o código por mensagem.</p>
    </main>
  </body>
</html>
